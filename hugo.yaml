baseURL: "https://ilvallod.github.io/"
title: ilvallod
pagination.pagerSize: 5
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

googleAnalytics: G-WX6EJH8QL5

minify:
  disableXML: true
  minifyOutput: true

params:
  mainSections: ["posts"]
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: ExampleSite
  description: "ExampleSite description"
  keywords: [Blog, Portfolio, PaperMod]
  author: ilvallod
  # author: ["Me", "You"] # multiple authors
  images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  displayFullLangName: true

  assets:
    favicon16x16: /assets/favicon-16x16.png
    favicon32x32: /assets/favicon-32x32.png
    apple_touch_icon: /assets/apple-touch-icon.png
    
  favicon: favicon.ico

  label:
    text: "ilvallod"
    icon: /apple-touch-icon.png
    iconHeight: 35

  # profile-mode
  profileMode:
    enabled: false # needs to be explicitly set
    title: ExampleSite
    subtitle: "This is subtitle"
    imageUrl: "<img location>"
    imageWidth: 120
    imageHeight: 120
    imageTitle: my image
    buttons:
      - name: Posts
        url: posts
      - name: Tags
        url: tags

  socialIcons:
    - name: github
      url: "https://github.com/ilvallod"
    - name: linkedin
      url: "https://www.linkedin.com/in/ilvallod/"
    - name: x
      url: "https://x.com/ilvallod"
    - name: youtube
      url: "https://www.youtube.com/@ilvallod"

  analytics:
    google:
      SiteVerificationTag: "XYZabc"
    bing:
      SiteVerificationTag: "XYZabc"
    yandex:
      SiteVerificationTag: "XYZabc"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]
      
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai
  goldmark:
    extensions:
      footnote: true
    renderer:
      unsafe: true

services:
  disqus:
    shortname: ilvallod
    
taxonomies:
  tag: "tags"
  category: "categories"

# Multi-language
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false
languages:
  en:
    languageName: English
    weight: 1 
    menus:
      main:
        - identifier: posts
          name: Posts
          url: /posts/
          weight: 20
        - identifier: about
          name: About
          url: /about/
          weight: 10
        - identifier: resources
          name: Resources
          url: /resources/
          weight: 30
        - identifier: notes
          name: Notes
          url: /notes/
          weight: 40
    params:
      homeInfoParams:
        Title: "Hello world! 👋"
        Content: |
          This is my corner that I wanted to open to share thoughts and tick off items on my backlog list :)

          I am an atypical Italian computer scientist. It's the right place if you want to learn more [about me](about/), browse my [thoughts](posts/), or pick up some advice on the [resources](resources/) that have impressed me the most.
  it:
    languageName: Italiano
    weight: 2
    menus:
      main:
        - identifier: posts
          name: Post
          url: /posts/
          weight: 20
        - identifier: about
          name: Chi sono
          url: /about/
          weight: 10
        - identifier: resources
          name: Risorse
          url: /resources/
          weight: 30
        - identifier: notes
          name: Note
          url: /notes/
          weight: 40
    params:
      homeInfoParams:
        Title: "Ciao 👋"
        Content: |
          Questo è l'angolo dove filosofeggio e condivido alcuni dei miei pensieri. Ho deciso di aprirlo per spuntare cose dalla mia todo list :)
          È il posto giusto se vuoi saperne di più [su di me](about/), leggere i miei [post](posts/), o prendere spunto dalle [risorse](resources/) che mi hanno colpito di più.
